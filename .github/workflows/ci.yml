name: Credit Risk Platform CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  rust-backend:
    name: Rust Backend (Test & Clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Run cargo test
        run: cargo test --manifest-path backend/Cargo.toml
      - name: Run cargo clippy
        run: cargo clippy --manifest-path backend/Cargo.toml --all-targets -- -D warnings

  python-ml-oracles:
    name: Python ML Service (Pytest & Mathematical Oracles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r ml_service/requirements.txt pytest httpx
      - name: Run unit tests & mathematical QA oracles
        run: |
          python -m pytest ml_service/tests/ -v
          python -m pytest ml_service/tests/qa_oracles.py -v

  frontend-build:
    name: Frontend TypeScript & Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies & build
        working-directory: frontend
        run: |
          npm ci
          npm run build
