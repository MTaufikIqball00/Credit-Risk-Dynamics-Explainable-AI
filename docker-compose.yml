services:
  ml_service:
    build:
      context: .
      dockerfile: ml_service/Dockerfile
    ports:
      - "8241:8241"
    environment:
      - PORT=8241
      - CORS_ALLOWED_ORIGINS=http://localhost:3240,http://127.0.0.1:3240,http://backend:8240
    volumes:
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8241/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8240:8240"
    depends_on:
      - ml_service
    environment:
      - HOST=0.0.0.0
      - PORT=8240
      - DATABASE_URL=sqlite:///app/data/credit_risk.db?mode=rwc
      - ML_SERVICE_URL=http://ml_service:8241
      - CORS_ALLOWED_ORIGINS=http://localhost:3240,http://127.0.0.1:3240
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3240:3240"
    depends_on:
      - backend
